# Author settings: raw/configs/overall.yaml + raw/configs/models/DCBR.yaml.
# Protocol adaptation only: root dataset, ReCoBR top-K and validation selection.
iFashion:
  data_path: ./datasets  # Relative to the project root, independent of shell cwd.
  embedding_size: 64
  batch_size_train: 2048
  batch_size_test: 2048
  topk: [10, 20, 40, 80]
  neg_num: 1
  lr: 1.0e-3
  test_interval: 5
  seed: 0  # Author train.py default; override explicitly with --seed if needed.

  dims: [1000]
  norm: false
  time_emb_dim: 10
  steps: 140
  noise_scale: 0.1
  noise_min: 0.0001
  noise_max: 0.02
  sampling_noise: false
  sampling_steps: 0
  rebuild_k: 1
  lambda_0: 2.0

  num_layers: 2
  upsilon_UB: 0.05
  upsilon_UI: 0.0
  upsilon_BI: 0.2
  xi_UB: [0.5, 0.5, 0.0]
  xi_UI: [0.3, 0.4, 0.3]
  xi_BI: [0.5, 0.5, 0.0]
  omega: 0.5

  gamma_1: 0.3
  gamma_2: 0.2
  tau: 0.08
  lambda_1: 0.3
  lambda_2: 1.0e-6
  epochs: 50

# Youshu工程配置；初始来源为作者MealRec+L，现按已完成历史的完整精度验证指标修正。
# 选参：验证Recall@20优先，完全相同再比验证NDCG@20；训练内仍用双指标同时严格提高选epoch。
# 历史验证优胜：youshu_round_02 / tau_010；不是仅指最近K搜索轮次优胜。
# EXECUTION_ID: 20261025T115614_4738c53b；best_epoch=69，即第70轮；完整预算90轮、seed=0。
# lambda_1=0.02、lambda_0=2000、K=1、omega=0.3、tau=0.1、gamma=(0.3,0.2)、lambda_2=1e-5。
# 验证@20：Recall=0.27404046711304497，NDCG=0.13345297207176463。
# 测试@10：Recall=0.18752272，NDCG=0.13085166；@20：Recall=0.26680041，NDCG=0.15351393。
# 测试@40：Recall=0.37340280，NDCG=0.18216333；@80：Recall=0.48317435，NDCG=0.20760588。
# 最新K轮k_11的验证Recall@20=0.2739693866303016，略低于上述历史配置；不混称全历史验证最优。
# 旧轮曾按测试指标作配置选择，其历史规则保留原样；本次补搜统一使用验证指标，测试只报告。
# 新增youshu_round_04_coverage：复用该条TXT历史对照，新增49个实验，逐阶段完整继承优胜。
# 当前值是本轮起点；搜索运行只回写计划状态和结果，不自动覆盖本基础配置。
Youshu:
  data_path: ./datasets
  embedding_size: 64
  batch_size_train: 2048
  batch_size_test: 2048
  topk:
  - 10
  - 20
  - 40
  - 80
  neg_num: 1
  lr: 0.001
  test_interval: 5
  seed: 0
  dims:
  - 1000
  norm: false
  time_emb_dim: 10
  steps: 5
  noise_scale: 1.0
  noise_min: 0.0001
  noise_max: 0.02
  sampling_noise: false
  sampling_steps: 0
  rebuild_k: 1
  lambda_0: 2000.0
  num_layers: 2
  upsilon_UB: 0.05
  upsilon_UI: 0.0
  upsilon_BI: 0.1
  xi_UB:
  - 0.6
  - 0.3
  - 0.1
  xi_UI:
  - 0.4
  - 0.6
  - 0.0
  xi_BI:
  - 0.5
  - 0.4
  - 0.1
  omega: 0.3
  gamma_1: 0.3
  gamma_2: 0.2
  tau: 0.1
  lambda_1: 0.02
  lambda_2: 1.0e-05
  epochs: 90

# NetEase 初始配置：本工程综合设置，尚无正式实验结果，不是作者报告的 NetEase 配置。
# 扩散整组采用作者 MealRec+H/L 共同设置：steps=5、noise_scale=1、lambda_0=1000；
# DNN结构及方差端点保持作者设置；rebuild_k=1为初值，修订版先搜K，不关闭DCBR核心扩散。
# lambda_1=0.02参考作者MealRec+H及已完成的DCBR-Youshu经验；gamma=(0.3,0.2)采用作者MealRec+L/iFashion设置。
# 噪声及UI/BI逐层权重参考用户已完成搜参的ReCoBR-NetEase中对应传播机制；最优值仍需DCBR验证。
# UB图及其作用不同，xi_UB保留DCBR作者MealRec+L值，不直接采用ReCoBR的UB逐层权重。
# omega=0.4由ReCoBR的UI/BI权重0.2/0.3归一化提出，仅为工程初值，不是三视图融合的等价转换。
# tau=0.2同时参考ReCoBR-NetEase和DCBR作者两个MealRec配置；lambda_2=1e-5采用DCBR作者值。
# 初始训练预算按用户要求为40轮；seed=4096与ReCoBR-NetEase一致，固定种子，不作为搜索项。
# 用户已停止旧netease_round_01；修订版netease_round_01_k共24个新实验，初始对照后先搜K再搜其余五参数。
# 总入口run_k_search.py先完成Youshu的5个新K实验，再启动NetEase；两轮均按验证Recall@20优先、NDCG@20次优选参。
# 下列仍为初始配置，运行不会自动覆盖为优胜值；单独训练显式传入 --experiment-case second。
NetEase:
  data_path: ./datasets
  embedding_size: 64
  batch_size_train: 2048
  batch_size_test: 2048
  topk: [10, 20, 40, 80]
  neg_num: 1
  lr: 1.0e-3
  test_interval: 5
  seed: 4096
  dims: [1000]
  norm: false
  time_emb_dim: 10
  steps: 5
  noise_scale: 1.0
  noise_min: 0.0001
  noise_max: 0.02
  sampling_noise: false
  sampling_steps: 0
  rebuild_k: 1
  lambda_0: 1000.0
  num_layers: 2
  upsilon_UB: 0.0
  upsilon_UI: 0.0
  upsilon_BI: 0.2
  xi_UB: [0.6, 0.3, 0.1]
  xi_UI: [0.25, 0.65, 0.1]
  xi_BI: [0.4, 0.4, 0.2]
  omega: 0.4
  gamma_1: 0.3
  gamma_2: 0.2
  tau: 0.2
  lambda_1: 0.02
  lambda_2: 1.0e-5
  epochs: 40

