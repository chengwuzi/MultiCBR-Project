# Meal-H 独立搜参计划；配置定义和脚本管理的运行状态集中保存。
version: 1
base_config: ReCoBR_files/config.yaml
work_dir: ReCoBR_files/Meal-H/log/tuning
result_file: ReCoBR_files/Meal-H/搜参结果.txt
defaults:
  gpu: '0'
  device: cuda
  max_attempts: 3
  retry_delay_seconds: 5
  console_interval_seconds: 30
  stream_output: false
rounds:
- id: meal_h_round_01
  dataset: Meal-H
  note: 第一轮共26个新实验：无扩散初始对照1个；无扩散c_lambda上下各3值；固定优胜c_lambda后开启扩散搜6个K；固定优胜c_lambda和K后融合比例粗搜7组、围绕同一个粗搜优胜细搜6组（每次在两个视图间转移0.05）。从K阶段起始终开启扩散，融合前对比全程关闭。固定150轮、seed=2026。阶段选优按未舍入验证Recall@20优先、完全相同再比验证NDCG@20，完全平局保留声明顺序在前者。测试仅报告。最终优胜只从扩散开启后的19个配置中选择。
  selection_rule: validation_recall20_then_ndcg20
  overrides:
    data_path: ./datasets
    batch_size_train: 2048
    batch_size_test: 2048
    topk:
    - 10
    - 20
    - 40
    - 80
    neg_num: 1
    seed: 2026
    aug_type: Noise
    ed_interval: 1
    embedding_sizes:
    - 64
    num_layerss:
    - 2
    UB_ratios:
    - 0.05
    UI_ratios:
    - 0.0
    BI_ratios:
    - 0.2
    fusion_weights:
      modal_weight:
      - 0.1
      - 0.3
      - 0.6
      UB_layer:
      - 0.5
      - 0.5
      - 0.0
      UI_layer:
      - 0.3
      - 0.4
      - 0.3
      BI_layer:
      - 0.5
      - 0.5
      - 0.0
    lrs:
    - 0.001
    l2_regs:
    - 1.0e-05
    c_lambdas:
    - 0.05
    c_temps:
    - 0.2
    epochs: 150
    test_interval: 5
    latent_rebuild:
      enabled: false
      rebuild_k: 13
      latent_diffusion_user_embedding_path: ./datasets/Meal-H_UB_emb/MealRec+H-user-10261919.pt
      latent_diffusion_bundle_embedding_path: ./datasets/Meal-H_UB_emb/MealRec+H-bundle-10261919.pt
      latent_diffusion_hidden_dim: 128
      latent_diffusion_time_dim: 16
      latent_diffusion_denoiser_layers: 2
      latent_diffusion_dropout: 0.1
      latent_diffusion_num_steps: 12
      latent_diffusion_beta_start: 0.0001
      latent_diffusion_beta_end: 0.02
      latent_diffusion_set_loss_weight: 0.05
      latent_diffusion_lr: 0.001
      latent_diffusion_weight_decay: 1.0e-05
      latent_diffusion_batch_size: 1024
      latent_diffusion_infer_batch_size: 256
      latent_diffusion_reset_after_epoch: -1
      latent_diffusion_reset_optimizer: false
    anchor_cl:
      enabled: false
      anchor_cl_lambda: 0.0
      temp: 0.2
      user_cl: true
      bundle_cl: true
      ub_ui_user_weight: 1.0
      ub_bi_user_weight: 1.0
      ub_ui_bundle_weight: 1.0
      ub_bi_bundle_weight: 1.0
    ui_bundle_user_agg_beta: 0.0
    bi_user_bundle_agg_beta: 0.0
  experiments:
  - id: initial
    note: 无扩散初始对照；保留当前c_lambda、K字段及原融合比例。K此时不生效，不能复用为开启扩散后的K对照。
    overrides: {}
    status: PENDING
    success: false
  - id: cl_001
    note: 关闭扩散，c_lambda=0.01；相对初值上下各三个候选。非零候选来自论文敏感性分析。固定初始融合比例及其他参数。
    overrides:
      c_lambdas:
      - 0.01
      latent_rebuild:
        enabled: false
    inherit_best:
      candidates:
      - initial
      rule: validation_recall20_then_ndcg20
    status: PENDING
    success: false
  - id: cl_002
    note: 关闭扩散，c_lambda=0.02；相对初值上下各三个候选。非零候选来自论文敏感性分析。固定初始融合比例及其他参数。
    overrides:
      c_lambdas:
