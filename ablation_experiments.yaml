# Ablation experiment list.
#
# Each experiment inherits the tuned defaults from config.yaml for its dataset.
# Only put parameters that differ from config.yaml under overrides.
#
# Run examples:
#   python run_ablation_experiments.py --dry-run
#   python run_ablation_experiments.py --only wo_table --gpu 0
#   python run_ablation_experiments.py --only topk_sensitivity --gpu 0

experiments:
  # ---------------------------------------------------------------------------
  # 1. Component ablation table
  # Full results are taken from existing best records. These rows run only
  # the w/o variants for Youshu and NetEase.
  # ---------------------------------------------------------------------------
  - name: Youshu_wo_diffusion
    dataset: Youshu
    group: wo_table
    enabled: true
    overrides:
      latent_rebuild.enabled: false

  - name: Youshu_wo_dual_cl
    dataset: Youshu
    group: wo_table
    enabled: true
    overrides:
      anchor_cl.enabled: false
      c_lambdas: [0.0]

  - name: Youshu_wo_prefusion_cl
    dataset: Youshu
    group: wo_table
    enabled: true
    overrides:
      anchor_cl.enabled: false

  - name: Youshu_wo_postfusion_cl
    dataset: Youshu
    group: wo_table
    enabled: true
    overrides:
      c_lambdas: [0.0]

  - name: NetEase_wo_diffusion
    dataset: NetEase
    group: wo_table
    enabled: true
    overrides:
      latent_rebuild.enabled: false

  - name: NetEase_wo_dual_cl
    dataset: NetEase
    group: wo_table
    enabled: true
    overrides:
      anchor_cl.enabled: false
      c_lambdas: [0.0]

  - name: NetEase_wo_prefusion_cl
    dataset: NetEase
    group: wo_table
    enabled: true
    overrides:
      anchor_cl.enabled: false

  - name: NetEase_wo_postfusion_cl
    dataset: NetEase
    group: wo_table
    enabled: true
    overrides:
      c_lambdas: [0.0]

