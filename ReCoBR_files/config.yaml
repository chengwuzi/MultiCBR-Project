# ReCoBR在Meal-H、Meal-L上的配置，由本目录train.py及搜参入口读取。
# 所有相对路径均以项目根目录为准；Meal-H保留工程初值，Meal-L已更新为首轮验证优胜配置。
# 当前第一轮：初始对照及c_lambda阶段关闭扩散；从K搜索开始开启，此后保持开启。
# 融合前UB锚定对比全程关闭，融合后对比学习保持启用。
# 已登记轮次在计划overrides中冻结完整初值；各阶段模块状态及搜索范围由计划明确指定。
# 其余参数调完后，再单独研究是否启用融合前对比及其权重，不自动切换模块。
# 根目录训练入口和config.yaml保持原状；本文件由ReCoBR_files/train.py独立加载。

Meal-H:
  data_path: ./datasets
  batch_size_train: 2048
  batch_size_test: 2048
  topk: [10, 20, 40, 80]
  neg_num: 1
  seed: 2026

  aug_type: Noise
  ed_interval: 1
  embedding_sizes: [64]
  num_layerss: [2]

  # 图编码以现有iFashion配置为迁移起点，不将其视为Meal-H最优设置。
  UB_ratios: [0.05]
  UI_ratios: [0.0]
  BI_ratios: [0.2]
  fusion_weights:
    modal_weight: [0.1, 0.3, 0.6]
    UB_layer: [0.5, 0.5, 0.0]
    UI_layer: [0.3, 0.4, 0.3]
    BI_layer: [0.5, 0.5, 0.0]

  lrs: [1.0e-3]
  l2_regs: [1.0e-5]
  c_lambdas: [0.05]
  c_temps: [0.2]
  epochs: 150
  test_interval: 5

  latent_rebuild:
    enabled: false
    # 在训练历史内筛选，保留min(K,该用户训练交互数)条边；K=13约保留37.71%的训练边。
    rebuild_k: 13
    latent_diffusion_user_embedding_path: ./datasets/Meal-H_UB_emb/MealRec+H-user-10261919.pt
    latent_diffusion_bundle_embedding_path: ./datasets/Meal-H_UB_emb/MealRec+H-bundle-10261919.pt
    latent_diffusion_hidden_dim: 128
    latent_diffusion_time_dim: 16
    latent_diffusion_denoiser_layers: 2
    latent_diffusion_dropout: 0.1
    latent_diffusion_num_steps: 12
    latent_diffusion_beta_start: 1.0e-4
    latent_diffusion_beta_end: 0.02
    latent_diffusion_set_loss_weight: 0.05
    latent_diffusion_lr: 1.0e-3
    latent_diffusion_weight_decay: 1.0e-5
    latent_diffusion_batch_size: 1024
    latent_diffusion_infer_batch_size: 256
    latent_diffusion_reset_after_epoch: -1
    latent_diffusion_reset_optimizer: false

  # 用户已决定本阶段关闭：权重置0，其余字段仅保留接口结构，不生效、不参与搜参。
  # 后续是否启用及采用何种非零权重，待其余参数调完后另行研究。
  anchor_cl:
    enabled: false
    anchor_cl_lambda: 0.0
    temp: 0.2
    user_cl: true
    bundle_cl: true
    ub_ui_user_weight: 1.0
    ub_bi_user_weight: 1.0
    ub_ui_bundle_weight: 1.0
    ub_bi_bundle_weight: 1.0

  ui_bundle_user_agg_beta: 0.0
  bi_user_bundle_agg_beta: 0.0

Meal-L:
  # 当前优胜来源：meal_l_round_01 / fusion_fine_ub_to_bi。
  # 执行ID：20261026T153105_103c613c；按验证Recall@20优先、相同再比验证NDCG@20选定。
  # best_epoch=9（第10轮）；150轮预算、seed=2026，扩散开启、融合前对比关闭。
  # val@20：Recall=0.2327171947337963，NDCG=0.12788282606336807。
  # test@20：Recall=0.19877750，NDCG=0.11496223；测试仅报告，不参与选参。
  data_path: ./datasets
  batch_size_train: 2048
  batch_size_test: 2048
  topk: [10, 20, 40, 80]
  neg_num: 1
  seed: 2026

  aug_type: Noise
  ed_interval: 1
  embedding_sizes: [64]
  num_layerss: [2]

  # modal_weight采用首轮优胜比例[UB,UI,BI]；层系数和扰动幅度仍沿用本轮固定设置。
  UB_ratios: [0.05]
  UI_ratios: [0.0]
  BI_ratios: [0.1]
  fusion_weights:
    modal_weight: [0.15, 0.6, 0.25]
    UB_layer: [0.7, 0.2, 0.1]
    UI_layer: [0.3, 0.4, 0.3]
    BI_layer: [0.5, 0.5, 0.0]

  lrs: [1.0e-3]
  l2_regs: [1.0e-5]
  c_lambdas: [0.01]
  c_temps: [0.2]
  epochs: 150
  test_interval: 5

  latent_rebuild:
    enabled: true
    # 只筛选已有训练边，保留min(K,该用户训练交互数)条；本轮优胜K=1。
    rebuild_k: 1
    latent_diffusion_user_embedding_path: ./datasets/Meal-L_UB_emb/MealRec+L-user-10261921.pt
    latent_diffusion_bundle_embedding_path: ./datasets/Meal-L_UB_emb/MealRec+L-bundle-10261921.pt
    latent_diffusion_hidden_dim: 128
    latent_diffusion_time_dim: 16
    latent_diffusion_denoiser_layers: 2
    latent_diffusion_dropout: 0.1
    latent_diffusion_num_steps: 12
    latent_diffusion_beta_start: 1.0e-4
    latent_diffusion_beta_end: 0.02
    latent_diffusion_set_loss_weight: 0.05
    latent_diffusion_lr: 1.0e-3
    latent_diffusion_weight_decay: 1.0e-5
    latent_diffusion_batch_size: 1024
    latent_diffusion_infer_batch_size: 256
    latent_diffusion_reset_after_epoch: -1
    latent_diffusion_reset_optimizer: false

  # 与Meal-H保持同一阶段约束，当前不搜索任何融合前对比参数。
  anchor_cl:
    enabled: false
    anchor_cl_lambda: 0.0
    temp: 0.2
    user_cl: true
    bundle_cl: true
    ub_ui_user_weight: 1.0
    ub_bi_user_weight: 1.0
    ub_ui_bundle_weight: 1.0
    ub_bi_bundle_weight: 1.0

  ui_bundle_user_agg_beta: 0.0
  bi_user_bundle_agg_beta: 0.0
