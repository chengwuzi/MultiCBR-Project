NetEase:
  data_path: './datasets'
  batch_size_train: 2048
  batch_size_test: 2048
  topk: [10, 20, 40, 80]
  neg_num: 1
  seed: 4096

  aug_type: "Noise"
  ed_interval: 1
  embedding_sizes: [64]
  num_layerss: [2]


  UB_ratios: [0.0]
  UI_ratios: [0.0]
  BI_ratios: [0.2]

  fusion_weights:
    modal_weight: [0.5, 0.2, 0.3]
    UB_layer: [0.35, 0.15, 0.5]
    UI_layer: [0.25, 0.65, 0.1]
    BI_layer: [0.4, 0.4, 0.2]

  lrs: [1.0e-3]
  l2_regs: [1.0e-5]
  c_lambdas: [0.05]
  c_temps: [0.2]

  epochs: 50
  test_interval: 5

  latent_rebuild:
    enabled: false
    rebuild_k: 13
    latent_diffusion_user_embedding_path: './datasets/NetEase_UB_emb/NetEase-user-04261815.pt'
    latent_diffusion_bundle_embedding_path: './datasets/NetEase_UB_emb/NetEase-bundle-04261815.pt'
    latent_diffusion_hidden_dim: 128
    latent_diffusion_time_dim: 16
    latent_diffusion_denoiser_layers: 2
    latent_diffusion_dropout: 0.1
    latent_diffusion_num_steps: 12
    latent_diffusion_beta_start: 1.0e-4
    latent_diffusion_beta_end: 0.02
    latent_diffusion_set_loss_weight: 0.05
    latent_diffusion_lr: 1.0e-3
    latent_diffusion_weight_decay: 1.0e-5
    latent_diffusion_batch_size: 1024
    latent_diffusion_infer_batch_size: 256
    latent_diffusion_reset_after_epoch: -1
    latent_diffusion_reset_optimizer: false

  anchor_cl:
    enabled: true
    anchor_cl_lambda: 0.005
    temp: 0.2
    user_cl: true
    bundle_cl: true
    ub_ui_user_weight: 1.0
    ub_bi_user_weight: 1.0
    ub_ui_bundle_weight: 1.0
    ub_bi_bundle_weight: 1.0

  # 子视图增强
  # 最佳结果参数列表 （0+0.35   range=0-1   min=0）
  ui_bundle_user_agg_beta: 0
  bi_user_bundle_agg_beta: 0.35


iFashion:
  data_path: './datasets'
  train_style: "dwt"
  batch_size_train: 2048
  batch_size_test: 2048
  topk: [10, 20, 40, 80]
  neg_num: 1
  seed: 2026 # Align with the DWT reference training setup for iFashion

  # the following are the best settings
  aug_type: "Noise"
  ed_interval: 1
  embedding_sizes: [64]
  num_layerss: [2]


  UB_ratios: [0.05]
  UI_ratios: [0.0]
  BI_ratios: [0.2]

  fusion_weights:
    modal_weight: [0.0, 0.5, 0.5]
    UB_layer: [0.5, 0.5, 0.0]
    UI_layer: [0.3, 0.4, 0.3]
    BI_layer: [0.5, 0.5, 0.0]

  lrs: [1.0e-3]
  l2_regs: [1.0e-5]
  c_lambdas: [0.1]
  c_temps: [0.2]

  epochs: 30
  test_interval: 5

  dwt:
    rebuild_strategy: "user_pref_diffusion" # options: origin, latent_diffusion, user_pref_diffusion
    use_latent_diffusion_rebuild: false # legacy compatibility flag; rebuild_strategy takes precedence
    rebuild_k: 3
    latent_diffusion_user_embedding_path: './datasets/iFashion_UB_emb/iFashion_UB-user-04261842.pt'
    latent_diffusion_bundle_embedding_path: './datasets/iFashion_UB_emb/iFashion_UB-bundle-04261842.pt'
    latent_diffusion_hidden_dim: 128
    latent_diffusion_time_dim: 16
    latent_diffusion_denoiser_layers: 2
    latent_diffusion_dropout: 0.1
    latent_diffusion_num_steps: 12
    latent_diffusion_beta_start: 1.0e-4
    latent_diffusion_beta_end: 0.02
    latent_diffusion_set_loss_weight: 0.05
    latent_diffusion_lr: 1.0e-3
    latent_diffusion_weight_decay: 1.0e-5
    latent_diffusion_batch_size: 1024
    latent_diffusion_infer_batch_size: 256
    latent_diffusion_reset_after_epoch: -1
    latent_diffusion_reset_optimizer: false

    user_pref_diffusion:
      enabled: true
      hidden_dim: 128
      time_dim: 16
      denoiser_layers: 2
      dropout: 0.1
      num_steps: 12
      beta_start: 1.0e-4
      beta_end: 0.02
      lr: 1.0e-3
      weight_decay: 1.0e-5
      batch_size: 1024
      infer_batch_size: 256
      tau_select: 0.1
      target_num: 4
      neg_num_for_core: 8
      neg_sampling: "hard"
      lambda_query: 0.0
      lambda_consistency: 0.0
      lambda_anchor: 0.0
      anchor_type: "cosine"
      infer_mode: "one_step" # one_step matches the training objective; iterative is kept only for ablation
      infer_step: 0

    gamma_1: 0.3
    gamma_2: 0.2
    tau: 0.08
    lambda_1: 0.3
    lambda_2: 1.0e-6

  # pre-fusion cross-view contrastive learning (UB-anchored)
  anchor_cl:
    enabled: false
    anchor_cl_lambda: 0.07
    temp: 0.2
    user_cl: true
    bundle_cl: true
    ub_ui_user_weight: 1.0
    ub_bi_user_weight: 1.0
    ub_ui_bundle_weight: 1.0
    ub_bi_bundle_weight: 1.0

  # 子视图增强
  ui_bundle_user_agg_beta: 0
  bi_user_bundle_agg_beta: 0


