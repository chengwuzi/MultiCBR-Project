# Author settings: raw/configs/overall.yaml + raw/configs/models/DCBR.yaml.
# Protocol adaptation only: root dataset, ReCoBR top-K and validation selection.
iFashion:
  data_path: ./datasets  # Relative to the project root, independent of shell cwd.
  embedding_size: 64
  batch_size_train: 2048
  batch_size_test: 2048
  topk: [10, 20, 40, 80]
  neg_num: 1
  lr: 1.0e-3
  test_interval: 5
  seed: 0  # Author train.py default; override explicitly with --seed if needed.

  dims: [1000]
  norm: false
  time_emb_dim: 10
  steps: 140
  noise_scale: 0.1
  noise_min: 0.0001
  noise_max: 0.02
  sampling_noise: false
  sampling_steps: 0
  rebuild_k: 1
  lambda_0: 2.0

  num_layers: 2
  upsilon_UB: 0.05
  upsilon_UI: 0.0
  upsilon_BI: 0.2
  xi_UB: [0.5, 0.5, 0.0]
  xi_UI: [0.3, 0.4, 0.3]
  xi_BI: [0.5, 0.5, 0.0]
  omega: 0.5

  gamma_1: 0.3
  gamma_2: 0.2
  tau: 0.08
  lambda_1: 0.3
  lambda_2: 1.0e-6
  epochs: 50

# Engineering initialization, not an author-reported Youshu configuration.
# MealRec+L model settings from raw/configs/models/DCBR.yaml; shared settings
# from raw/configs/overall.yaml, unified top-K and seed 0. User sets 90 epochs
# for Youshu instead of the author's 150-epoch MealRec+L training budget.
# Selected after round 02 using test Recall@20: lambda_1=0.02, lambda_0=2000,
# omega=0.3, tau=0.25, gamma=(0.3, 0.2). User retains 90 epochs and seed 0.
# Selected run: tau_025, checkpoint epoch 80. Historical rounds pin old values.
Youshu:
  data_path: ./datasets
  embedding_size: 64
  batch_size_train: 2048
  batch_size_test: 2048
  topk: [10, 20, 40, 80]
  neg_num: 1
  lr: 1.0e-3
  test_interval: 5
  seed: 0
  dims: [1000]
  norm: false
  time_emb_dim: 10
  steps: 5
  noise_scale: 1.0
  noise_min: 0.0001
  noise_max: 0.02
  sampling_noise: false
  sampling_steps: 0
  rebuild_k: 1
  lambda_0: 2000.0
  num_layers: 2
  upsilon_UB: 0.05
  upsilon_UI: 0.0
  upsilon_BI: 0.1
  xi_UB: [0.6, 0.3, 0.1]
  xi_UI: [0.4, 0.6, 0.0]
  xi_BI: [0.5, 0.4, 0.1]
  omega: 0.3
  gamma_1: 0.3
  gamma_2: 0.2
  tau: 0.25
  lambda_1: 0.02
  lambda_2: 1.0e-5
  epochs: 90
