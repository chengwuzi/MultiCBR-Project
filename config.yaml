NetEase:
  data_path: './datasets'
  batch_size_train: 2048
  batch_size_test: 2048
  topk: [10, 20, 40, 80]
  neg_num: 1
  seed: 4096

  aug_type: "Noise"
  ed_interval: 1
  embedding_sizes: [64]
  num_layerss: [2]


  UB_ratios: [0.0]
  UI_ratios: [0.0]
  BI_ratios: [0.2]

  fusion_weights:
    modal_weight: [0.5, 0.2, 0.3]
    UB_layer: [0.35, 0.15, 0.5]
    UI_layer: [0.25, 0.65, 0.1]
    BI_layer: [0.4, 0.4, 0.2]

  lrs: [1.0e-3]
  l2_regs: [1.0e-5]
  c_lambdas: [0.05]
  c_temps: [0.2]

  epochs: 50
  test_interval: 5

  latent_rebuild:
    enabled: false
    rebuild_k: 13
    latent_diffusion_user_embedding_path: './datasets/NetEase_UB_emb/NetEase-user-04261815.pt'
    latent_diffusion_bundle_embedding_path: './datasets/NetEase_UB_emb/NetEase-bundle-04261815.pt'
    latent_diffusion_hidden_dim: 128
    latent_diffusion_time_dim: 16
    latent_diffusion_denoiser_layers: 2
    latent_diffusion_dropout: 0.1
    latent_diffusion_num_steps: 12
    latent_diffusion_beta_start: 1.0e-4
    latent_diffusion_beta_end: 0.02
    latent_diffusion_set_loss_weight: 0.05
    latent_diffusion_lr: 1.0e-3
    latent_diffusion_weight_decay: 1.0e-5
    latent_diffusion_batch_size: 1024
    latent_diffusion_infer_batch_size: 256
    latent_diffusion_reset_after_epoch: -1
    latent_diffusion_reset_optimizer: false

  anchor_cl:
    enabled: true
    anchor_cl_lambda: 0.005
    temp: 0.2
    user_cl: true
    bundle_cl: true
    ub_ui_user_weight: 1.0
    ub_bi_user_weight: 1.0
    ub_ui_bundle_weight: 1.0
    ub_bi_bundle_weight: 1.0

  # 子视图增强
  # 最佳结果参数列表 （0+0.35   range=0-1   min=0）
  ui_bundle_user_agg_beta: 0
  bi_user_bundle_agg_beta: 0.35


iFashion:
  # 截至 2026-10-29，第六至十轮共 14 组已完成；以下按验证综合分数选定。
  # 轮次: stage1_clambda_recheck_07；实验 ID: clambda_030。
  # EXECUTION_ID: 20261028T135628_a6584711。
  # 验证选模分数: 0.5676286080（val Recall@20 + Recall@40 + NDCG@20 + NDCG@40）。
  # val@20: Recall=0.15418641, NDCG=0.09891195；val@40: Recall=0.20254033, NDCG=0.11198991。
  # 最佳轮次: 第 40 轮（best_epoch=39，从 0 计数）；默认训练预算保持 40 轮。
  # 单独延长训练可用 train.py --epochs 60，60 轮结果尚未获得。
  # test@10: Recall=0.11343226, NDCG=0.11459451。
  # test@20: Recall=0.15406646, NDCG=0.13089307。
  # test@40: Recall=0.20319149, NDCG=0.14812316。
  # test@80: Recall=0.25987125, NDCG=0.16497335。
  # 详情见 项目文档/工作事项.txt 第十项及 实验结果存档/Ifashion调参.txt。
  data_path: './datasets'
  batch_size_train: 2048
  batch_size_test: 2048
  topk: [10, 20, 40, 80]
  neg_num: 1
  seed: 2026

  # 当前选定配置；历史实验计划保留各自的覆盖项。
  aug_type: "Noise"
  ed_interval: 1
  embedding_sizes: [64]
  num_layerss: [2]


  UB_ratios: [0.05]
  UI_ratios: [0.0]
  BI_ratios: [0.2]

  fusion_weights:
    modal_weight: [0.05, 0.35, 0.6]
    UB_layer: [0.5, 0.5, 0.0]
    UI_layer: [0.3, 0.4, 0.3]
    BI_layer: [0.5, 0.5, 0.0]

  lrs: [1.0e-3]
  l2_regs: [1.0e-5]
  c_lambdas: [0.30]
  c_temps: [0.2]

  epochs: 40
  test_interval: 5

  latent_rebuild:
    enabled: true
    rebuild_k: 3
    latent_diffusion_user_embedding_path: './datasets/iFashion_UB_emb/iFashion_UB-user-04261842.pt'
    latent_diffusion_bundle_embedding_path: './datasets/iFashion_UB_emb/iFashion_UB-bundle-04261842.pt'
    latent_diffusion_hidden_dim: 128
    latent_diffusion_time_dim: 16
    latent_diffusion_denoiser_layers: 2
    latent_diffusion_dropout: 0.1
    latent_diffusion_num_steps: 12
    latent_diffusion_beta_start: 1.0e-4
    latent_diffusion_beta_end: 0.02
    latent_diffusion_set_loss_weight: 0.05
    latent_diffusion_lr: 1.0e-3
    latent_diffusion_weight_decay: 1.0e-5
    latent_diffusion_batch_size: 1024
    latent_diffusion_infer_batch_size: 256
    latent_diffusion_reset_after_epoch: -1
    latent_diffusion_reset_optimizer: false

  # pre-fusion cross-view contrastive learning (UB-anchored)
  anchor_cl:
    enabled: false
    anchor_cl_lambda: 0.07
    temp: 0.2
    user_cl: true
    bundle_cl: true
    ub_ui_user_weight: 1.0
    ub_bi_user_weight: 1.0
    ub_ui_bundle_weight: 1.0
    ub_bi_bundle_weight: 1.0

  # 子视图增强
  ui_bundle_user_agg_beta: 0
  bi_user_bundle_agg_beta: 0


