  dims: [1000]
  norm: false
  time_emb_dim: 10
  steps: 5
  noise_scale: 1.0
  noise_min: 0.0001
  noise_max: 0.02
  sampling_noise: false
  sampling_steps: 0
  rebuild_k: 1
  lambda_0: 1000.0
  num_layers: 2
  upsilon_UB: 0.0
  upsilon_UI: 0.0
  upsilon_BI: 0.2
  xi_UB: [0.6, 0.3, 0.1]
  xi_UI: [0.25, 0.65, 0.1]
  xi_BI: [0.4, 0.4, 0.2]
  omega: 0.4
